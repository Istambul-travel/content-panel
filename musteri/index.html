<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postiada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --navy:#111735; --purple:#7047EB; --purple-deep:#5B36D6; --purple-soft:#EDE8FF;
  --lilac:#F5F2FF; --white:#FFFFFF; --slate:#62677B; --slate-light:#8B90A3;
  --line:#E7E3F4; --line-strong:#D6D0EC; --bg:#F7F5FF;
  --ok:#0f7a3d; --ok-soft:#E8F6EF; --amber:#9a6a10; --amber-soft:#FFF4E0;
  --red:#a13a35; --red-soft:#FBE9E7;
  --shadow-sm:0 1px 2px rgba(17,23,53,.05),0 4px 14px rgba(17,23,53,.05);
  --r:14px; --r-btn:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--navy);
  font:15px/1.55 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.dsp{font-family:"Manrope",ui-sans-serif,system-ui,sans-serif;letter-spacing:-.018em;margin:0}
a{color:var(--purple-deep);text-decoration:none}
button{font:inherit;cursor:pointer}
.app{display:flex;min-height:100%}
aside{width:236px;flex-shrink:0;background:var(--white);border-right:1px solid var(--line);
  padding:22px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.mark{font-family:"Manrope",sans-serif;font-size:22px;font-weight:800;letter-spacing:-.03em;padding:0 6px}
.mark i{color:var(--purple);font-style:normal}
.sitebox{display:flex;align-items:center;gap:10px;width:100%;background:var(--lilac);
  border:1px solid var(--line);border-radius:12px;padding:9px 11px;text-align:left}
.sitebox select{flex:1;border:0;background:transparent;font:600 13px "Inter",sans-serif;color:var(--navy);outline:none}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;
  color:var(--slate);font-size:14px;font-weight:500}
nav a.on{background:var(--purple-soft);color:var(--purple-deep);font-weight:600}
nav a:hover:not(.on){background:var(--lilac)}
.grow{flex:1}
main{flex:1;padding:26px 30px 60px;min-width:0}
.head{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px}
.head h1{font-size:27px;font-weight:800}
.head p{margin:5px 0 0;font-size:14px;color:var(--slate)}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.pad{padding:18px 20px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.tile{background:var(--white);border:1px solid var(--line);border-left:3px solid var(--purple);
  border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow-sm)}
.tile .lbl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--slate-light)}
.tile .val{font-family:"Manrope",sans-serif;font-size:29px;font-weight:800;margin-top:7px}
.tile .val small{font-size:13px;font-weight:500;color:var(--slate-light);margin-left:4px}
.tile .sub{margin-top:5px;font-size:12px;color:var(--slate)}
.tile.bekliyor{border-left-color:var(--line-strong)}
.tile.bekliyor .val{color:var(--slate-light);font-size:20px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:600}
.pill i{width:6px;height:6px;border-radius:999px;display:block}
.p-ok{background:var(--ok-soft);color:#177A54}.p-ok i{background:#1F9D6B}
.p-bek{background:var(--amber-soft);color:#8A5A00}.p-bek i{background:#D28B0E}
.p-info{background:var(--lilac);color:var(--purple-deep)}.p-info i{background:var(--purple)}
.p-mute{background:#F1F1F5;color:var(--slate)}.p-mute i{background:var(--slate-light)}
.btn{border:0;border-radius:var(--r-btn);padding:11px 19px;font-size:14px;font-weight:600;
  background:var(--purple);color:#fff;box-shadow:0 6px 18px rgba(112,71,235,.22)}
.btn:hover{background:var(--purple-deep)}
.btn2{border:1.5px solid var(--purple);border-radius:var(--r-btn);padding:10px 17px;
  font-size:14px;font-weight:600;background:#fff;color:var(--purple-deep)}
.btn2:hover{background:var(--lilac)}
.bs{border:1.5px solid var(--line-strong);border-radius:10px;padding:5px 10px;font-size:12px;
  font-weight:600;background:#fff;color:var(--slate)}
.bs:hover{border-color:var(--purple);color:var(--purple-deep)}
.br{border:1.5px solid #E7D2D1;border-radius:10px;padding:5px 10px;font-size:12px;
  font-weight:600;background:#fff;color:var(--red)}
.br:hover{background:var(--red-soft)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}
.dow{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-light)}
.cell{border:1.5px solid var(--line);background:#FBFAFF;border-radius:11px;padding:8px;min-height:116px;
  display:flex;flex-direction:column;gap:5px}
.cell.dolu{background:#fff}
.cell.bugun{border-color:var(--purple)}
.cell .no{font-size:11.5px;font-weight:700;color:var(--slate-light)}
.cell.bugun .no{color:var(--purple-deep)}
.thumb{width:100%;height:40px;border-radius:8px;object-fit:cover;background:var(--lilac);display:block}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em}
.ttl{font-size:11.5px;font-weight:600;line-height:1.3}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 16px;font:700 13px "Manrope",sans-serif;background:#FBFAFF}
td{padding:12px 16px;border-top:1px solid var(--line);font-size:13.5px}
td.n,th.n{text-align:right}
.hidden{display:none!important}
.note{font-size:12.5px;color:var(--slate);line-height:1.55}
.uyari{background:#FFFDF8;border:1px solid #F0DCC0;border-radius:var(--r);padding:14px 16px;font-size:13px;color:#8A5A00}
.bos{padding:40px;text-align:center;color:var(--slate-light);font-size:14px}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;
  padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 14px 40px rgba(17,23,53,.3);
  opacity:0;pointer-events:none;transition:opacity .18s}
#toast.on{opacity:1}
@media (max-width:820px){aside{display:none}main{padding:18px 16px 60px}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="mark">post<i>i</i>ada</div>
  <div class="sitebox"><select id="site"></select></div>
  <nav id="nav"></nav>
  <div class="grow"></div>
  <div class="note" id="stamp"></div>
</aside>
<main id="main"><div class="bos">Yükleniyor…</div></main>
</div>
<div id="toast"></div>
<script>

// -------------------------------------------------------------- veri erisimi
// ON IZLEME SURUMU. Gercek musteri paneli (app.postiada.com, Faz 3) ayni
// musteri.json'u kendi sunucusundan okuyacak; burada depodan okunuyor ve
// panelin GitHub jetonu kullaniliyor. Musteriye BU sayfa verilmiyor.
const REPO = "Istambul-travel/travelpedia-content-engine";
const SITELER = ["istanbulhamam.com", "istambul.com"];
const TOKEN = () => localStorage.getItem("tce_token") || "";
const H = () => ({ Authorization: "Bearer " + TOKEN(), Accept: "application/vnd.github+json" });

async function oku(yol) {
  const r = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + yol +
                        "?ref=main&t=" + Date.now(), { headers: H() });
  if (!r.ok) throw new Error(yol + " okunamadi (" + r.status + ")");
  const j = await r.json();
  const b = atob(j.content.replace(/\n/g, ""));
  const u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return [JSON.parse(new TextDecoder("utf-8").decode(u)), j.sha];
}
async function yaz(yol, veri, mesaj, sha) {
  const metin = JSON.stringify(veri, null, 2);
  const bytes = new TextEncoder().encode(metin);
  let bin = ""; for (let i = 0; i < bytes.length; i += 8192)
    bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
  const r = await fetch("https://api.github.com/repos/" + REPO + "/contents/" + yol, {
    method: "PUT", headers: { ...H(), "Content-Type": "application/json" },
    body: JSON.stringify({ message: mesaj, content: btoa(bin), sha })
  });
  if (!r.ok) throw new Error("yazilamadi (" + r.status + ")");
}

// ------------------------------------------------------------------ yardimci
const E = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const SAYI = (n) => (n == null ? null : Number(n).toLocaleString("tr-TR"));
const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos",
            "Eylül","Ekim","Kasım","Aralık"];
const tarih = (g) => { if (!g) return ""; const d = new Date(g + "T00:00:00");
  return d.getDate() + " " + AY[d.getMonth()]; };
const BUGUN = new Date().toISOString().slice(0, 10);

function pill(durum) {
  const m = { "Yayımlandı": "p-ok", "Onaylandı": "p-ok", "Planlandı": "p-bek",
              "Konu seçildi": "p-info",
              "İptal edildi": "p-mute", "Çıkmadı": "p-mute", "Silindi": "p-mute" };
  return '<span class="pill ' + (m[durum] || "p-mute") + '"><i></i>' + E(durum) + "</span>";
}
function tile(lbl, val, birim, alt) {
  if (val == null) return '<div class="tile bekliyor"><div class="lbl">' + E(lbl) +
    '</div><div class="val">ölçüm bekliyor</div><div class="sub">' + E(alt || "") + "</div></div>";
  return '<div class="tile"><div class="lbl">' + E(lbl) + '</div><div class="val">' +
    E(val) + (birim ? "<small>" + E(birim) + "</small>" : "") +
    '</div><div class="sub">' + E(alt || "") + "</div></div>";
}
function toast(m) {
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("on");
  clearTimeout(window.__tt); window.__tt = setTimeout(() => t.classList.remove("on"), 2600);
}

const IKON = {
  bugun: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V21h14V9.8"/>',
  takvim: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  yazilar: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',
  gonderiler: '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
  marka: '<path d="M7 3c0 5 10 5 10 9s-10 4-10 9"/><path d="M17 3c0 5-10 5-10 9s10 4 10 9"/>',
  buyume: '<path d="M3 17l6-6 4 4 8-8"/><path d="M14 7h7v7"/>'
};
const svg = (d) => '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
  'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + d + "</svg>";
const BOLUM = [["bugun","Bugün"],["takvim","Takvim"],["yazilar","Yazılar"],
               ["gonderiler","Gönderiler"],["marka","Marka"],["buyume","Büyüme"]];

let D = null, SITE = localStorage.getItem("postiada_site") || SITELER[0], SEK = "bugun";

// ------------------------------------------------------------------- ekranlar
function ekranBugun() {
  const b = D.bugun, y = D.buyume;
  const s = b.sonraki;
  let sag = '<div class="card pad" style="width:330px"><div class="bos">Önümüzde planlanmış gönderi yok.</div></div>';
  if (s) {
    sag = '<div class="card pad" style="width:330px;display:flex;flex-direction:column;gap:12px">' +
      '<div style="display:flex;align-items:center;gap:8px"><h3 style="flex:1;font-size:15px;font-weight:700">Sırada</h3>' +
      pill(s.durum) + "</div>" +
      (s.kapak ? '<img class="thumb" style="height:150px" src="' + E(s.kapak) + '" alt="">'
               : '<div class="thumb" style="height:150px"></div>') +
      '<div><div style="font-size:14px;font-weight:600;line-height:1.35">' + E(s.baslik) + "</div>" +
      '<div style="margin-top:5px;font-size:12px;color:var(--slate-light)">' + tarih(s.gun) +
      (s.arketip_adi ? " · " + E(s.arketip_adi) : "") + "</div></div>" +
      (s.duzenlenebilir
        ? '<p class="note" style="margin:0">Beğenmezsen değiştir ya da iptal et — çıkmaz.</p>' +
          '<div style="display:flex;gap:8px">' + eylemler(s) + "</div>"
        : '<p class="note" style="margin:0">Bu gönderi artık değiştirilemez.</p>') +
      "</div>";
  }
  const cikan = b.cikan.length
    ? b.cikan.map((x) => satir(x)).join("")
    : '<div class="bos">Bugün yeni bir şey çıkmadı.</div>';
  return '<div class="head"><div style="flex:1"><h1>Bugün</h1><p>' +
      (b.onizlemede ? b.onizlemede + " gönderi önizlemede — çıkmadan önce değiştirebilirsin."
                    : "Önizlemede bekleyen gönderi yok.") +
      '</p></div></div>' +
    '<div class="row" style="align-items:stretch;flex-wrap:nowrap">' +
      '<div class="card" style="flex:1;min-width:0"><div class="pad" style="border-bottom:1px solid var(--line)">' +
      '<h3 style="font-size:15px;font-weight:700">Bugün çıkanlar</h3></div>' + cikan + "</div>" + sag +
    "</div>" +
    '<div class="tiles" style="margin-top:16px">' +
      tile("Aramada görünme", SAYI(y.arama.gosterim), "gösterim", donem(y.arama)) +
      tile("Tıklama", SAYI(y.arama.tiklama), "ziyaret", y.arama.ctr != null ? "tıklama oranı %" + y.arama.ctr : "") +
      tile("AI yönlendirmesi", SAYI(y.ai.toplam), "ziyaret", Object.keys(y.ai.kaynaklar || {}).join(", ") || "GA4") +
      tile("Toplam yazı", SAYI(b.toplam_yazi), "", b.toplam_gonderi + " gönderi çıktı") +
    "</div>";
}
const donem = (a) => (a.donem && a.donem.start ? a.donem.start + " → " + a.donem.end : "Search Console");

function satir(x) {
  return '<div style="display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--line)">' +
    (x.kapak ? '<img class="thumb" style="width:52px;height:38px" src="' + E(x.kapak) + '" alt="">'
             : '<div class="thumb" style="width:52px;height:38px"></div>') +
    '<div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:600">' + E(x.baslik) + "</div>" +
    '<div style="font-size:12px;color:var(--slate-light)">' +
      (x.tur === "yazi" ? "Yazı" : "Gönderi" + (x.arketip_adi ? " · " + E(x.arketip_adi) : "")) +
      " · " + tarih(x.gun) + "</div></div>" + pill(x.durum) + "</div>";
}

function eylemler(x) {
  // Iki ayri kayit turu: "konu" topics.json'da (henuz yazilmadi, iptal
  // BEDAVA), gonderi social.json'da (karesi cizildi, degistirilebilir).
  const tur = x.kayit === "konu" ? "konu" : "gonderi";
  const k = tur + "|" + E(x.baslik) + "|" + x.gun;
  if (x.foto_degistir) return '<span class="pill p-info"><i></i>Fotoğraf değişecek</span>';
  const iptal = '<button class="br" onclick="isaretle(\'iptal\',\'' + k + '\')">İptal</button>';
  if (tur === "konu") return iptal;
  return '<button class="bs" onclick="isaretle(\'foto\',\'' + k + '\')">Fotoğrafı değiştir</button>' + iptal;
}

function ekranTakvim() {
  // ILERIYE BAKAN TAKVIM. Ayin 1'inden baslamak yanlisti: ayin sonunda
  // acildiginda gelecek gunler ekranin altinda kaliyordu. Bugunden bir hafta
  // once basliyor, bes hafta cizilyor: gecmis bir bakista, gelecek tamamen
  // gorunur (25.09.2026).
  const bas = new Date(); bas.setDate(bas.getDate() - 7);
  bas.setDate(bas.getDate() - ((bas.getDay() + 6) % 7));
  const gunler = {};
  D.takvim.forEach((x) => { (gunler[x.gun] = gunler[x.gun] || []).push(x); });
  let h = '<div class="grid7">' + ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"]
    .map((d) => '<div class="dow">' + d + "</div>").join("");
  for (let i = 0; i < 35; i++) {
    const d = new Date(bas); d.setDate(bas.getDate() + i);
    const g = d.toISOString().slice(0, 10);
    const hepsi = gunler[g] || [];
    // En fazla uc kayit: kalabalik bir gun butun haftayi asagi itiyordu.
    // Gecmis gunlerde yayimlananlar ozetleniyor, gelecek gunler zaten seyrek.
    const liste = hepsi.slice(0, 3);
    const fazla = hepsi.length - liste.length;
    h += '<div class="cell' + (hepsi.length ? " dolu" : "") + (g === BUGUN ? " bugun" : "") + '">' +
      '<div class="no">' + d.getDate() +
        (d.getDate() === 1 ? " " + AY[d.getMonth()].slice(0, 3) : "") + "</div>" +
      liste.map((x) =>
        (x.kapak ? '<img class="thumb" src="' + E(x.kapak) + '" alt="">' : "") +
        '<div class="tag" style="color:' + (x.tur === "gonderi" ? "var(--purple-deep)" : "var(--slate)") + '">' +
        (x.tur === "gonderi" ? "GÖNDERİ" : "YAZI") + "</div>" +
        '<div class="ttl">' + E((x.baslik || "").slice(0, 46)) + "</div>" +
        (x.duzenlenebilir ? '<div style="display:flex;gap:4px;flex-wrap:wrap">' + eylemler(x) + "</div>"
                          : '<div>' + pill(x.durum) + "</div>")
      ).join("") +
      (fazla > 0 ? '<div class="note" style="font-size:11px">+' + fazla + " daha</div>" : "") +
      "</div>";
  }
  h += "</div>";
  return '<div class="head"><div style="flex:1"><h1>Takvim</h1>' +
    '<p>Önümüzdeki günleri şimdiden görüyorsun. Çıkmadan önce değiştirebilir ya da iptal edebilirsin.</p></div></div>' +
    '<div class="card pad">' + h + "</div>";
}

function ekranYazilar() {
  const y = D.yazilar;
  const govde = y.length ? y.map((x) =>
    "<tr><td>" + (x.url ? '<a href="' + E(x.url) + '" target="_blank" rel="noopener">' + E(x.baslik) + "</a>"
                        : E(x.baslik)) +
    '<div style="font-size:12px;color:var(--slate-light);margin-top:3px">' +
    (x.diller.length ? x.diller.length + " dile çevrildi · " + x.diller.join(", ").toUpperCase()
                     : "çeviri yok") + "</div></td>" +
    "<td>" + tarih(x.gun) + "</td>" +
    '<td class="n">' + (x.seo != null ? Math.round(x.seo) + " <small style=\"color:var(--slate-light)\">/100</small>"
                                      : '<span style="color:var(--slate-light)">—</span>') + "</td>" +
    "<td>" + pill(x.durum) + "</td></tr>").join("")
    : '<tr><td colspan="4"><div class="bos">Henüz yazı yok.</div></td></tr>';
  return '<div class="head"><div style="flex:1"><h1>Yazılar</h1><p>' + y.length +
    ' yazı yayımlandı. Kalite kapısını geçmeyen yazı yayımlanmaz.</p></div></div>' +
    '<div class="card" style="overflow:hidden"><table><thead><tr><th>Yazı</th><th>Tarih</th>' +
    '<th class="n">SEO</th><th>Durum</th></tr></thead><tbody>' + govde + "</tbody></table></div>";
}

function ekranGonderiler() {
  const g = D.gonderiler;
  if (!g.length) return '<div class="head"><h1>Gönderiler</h1></div><div class="card"><div class="bos">Henüz gönderi yok.</div></div>';
  const kart = (x) =>
    '<div class="card" style="overflow:hidden;width:232px">' +
    (x.kapak ? '<img src="' + E(x.kapak) + '" alt="" style="width:100%;height:232px;object-fit:cover;display:block">'
             : '<div style="height:232px;background:var(--lilac)"></div>') +
    '<div class="pad" style="padding:14px 15px">' +
    '<div style="font-size:13px;font-weight:600;line-height:1.35;min-height:35px">' +
      E((x.baslik || "").slice(0, 60)) + "</div>" +
    '<div style="margin-top:7px;font-size:11.5px;color:var(--slate-light)">' + tarih(x.gun) +
      (x.arketip ? " · " + String(x.arketip).padStart(2, "0") + " " + E(x.arketip_adi) : "") +
      (x.gorseller.length > 1 ? " · " + x.gorseller.length + " kare" : "") + "</div>" +
    '<div style="margin-top:9px;display:flex;gap:6px;flex-wrap:wrap">' + pill(x.durum) +
      (x.duzenlenebilir ? eylemler(x) : "") + "</div></div></div>";
  return '<div class="head"><div style="flex:1"><h1>Gönderiler</h1>' +
    '<p>On ayrı tasarım sırayla kullanılıyor; aynı tasarım üst üste çıkmaz.</p></div></div>' +
    '<div class="row">' + g.map(kart).join("") + "</div>";
}

function ekranMarka() {
  const m = D.marka;
  const sat = (a, b) => b ? '<div style="padding:13px 0;border-bottom:1px solid var(--line)">' +
    '<div class="lbl" style="font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--slate-light)">' +
    E(a) + '</div><div style="margin-top:6px;font-size:14px;line-height:1.6">' + E(b) + "</div></div>" : "";
  return '<div class="head"><div style="flex:1"><h1>Marka</h1>' +
    '<p>Her yazı ve gönderi buradan besleniyor. Değiştirmek istersen bize yaz.</p></div></div>' +
    '<div class="card pad" style="max-width:760px">' +
      sat("Marka", m.ad) + sat("Ne yapıyor", m.sektor) + sat("Şehir", m.sehir) +
      sat("Okur", m.okur) +
      sat("Yazı dili", (m.dil || "en").toUpperCase()) +
      sat("Çeviri dilleri", (m.ceviri_dilleri || []).join(", ").toUpperCase()) +
    "</div>" +
    '<div class="uyari" style="margin-top:16px;max-width:760px">Yazılardaki her olgu senin kendi ' +
    'sayfalarında birebir aranıyor. Sayfanda geçmeyen bir fiyat, süre ya da saat hiçbir yazıya girmiyor.</div>';
}

function ekranBuyume() {
  const y = D.buyume, a = y.arama, z = y.ziyaret, ai = y.ai;
  const kaynak = Object.entries(ai.kaynaklar || {});
  const eniyi = (y.en_iyi || []).filter((x) => x.oturum);
  return '<div class="head"><div style="flex:1"><h1>Büyüme</h1>' +
    '<p>Sayılar Search Console ve Google Analytics\'ten geliyor. Ölçülmemiş bir değer sıfır yazılmaz.</p></div></div>' +
    '<div class="tiles">' +
      tile("Gösterim", SAYI(a.gosterim), "", donem(a)) +
      tile("Tıklama", SAYI(a.tiklama), "", a.ctr != null ? "tıklama oranı %" + a.ctr : "") +
      tile("Ortalama sıra", a.sira != null ? String(a.sira).replace(".", ",") : null, "", "Search Console") +
      tile("Ziyaret", SAYI(z.oturum), "oturum", z.gun ? "son " + z.gun + " gün · GA4" : "GA4") +
    "</div>" +
    '<div class="row" style="margin-top:16px;align-items:stretch">' +
      '<div class="card pad" style="width:330px">' +
        '<h3 style="font-size:15px;font-weight:700">AI yönlendirmesi</h3>' +
        '<p class="note" style="margin:5px 0 10px">Yazılarını kaynak gösterip sitene okur yollayan modeller.</p>' +
        (kaynak.length
          ? kaynak.map(([k, v]) => '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)">' +
              '<span style="flex:1;font-size:13.5px">' + E(k) + '</span><span class="dsp" style="font-size:16px;font-weight:800">' +
              SAYI(v) + "</span></div>").join("") +
            '<div style="margin-top:10px;padding:11px 13px;background:var(--lilac);border-radius:11px" class="note">' +
            "Toplam " + SAYI(ai.toplam) + " ziyaret" + (z.gun ? " · son " + z.gun + " gün" : "") + "</div>"
          : '<div class="bos" style="padding:20px">Henüz AI yönlendirmesi ölçülmedi.</div>') +
      "</div>" +
      '<div class="card" style="flex:1;min-width:0;overflow:hidden">' +
        '<div class="pad" style="border-bottom:1px solid var(--line)"><h3 style="font-size:15px;font-weight:700">En çok okunan yazılar</h3></div>' +
        (eniyi.length
          ? '<table><thead><tr><th>Yazı</th><th class="n">Ziyaret</th></tr></thead><tbody>' +
            eniyi.map((x) => "<tr><td>" + E(x.baslik || x.yol) + '</td><td class="n">' + SAYI(x.oturum) + "</td></tr>").join("") +
            "</tbody></table>"
          : '<div class="bos">Ölçüm bekliyor.</div>') +
      "</div>" +
    "</div>";
}

// ---------------------------------------------------------------- eylemler
// "Fotografi degistir" ve "Iptal" kuyruga BIR ISARET yaziyor; motor bir
// sonraki turda okuyor (engine/social.py -> iptal / foto_degistir).
// Kayit SILINMIYOR: neyin neden cikmadigi gorunur kaliyor.
window.isaretle = async function (ne, anahtar) {
  const [tur, baslik, gun] = anahtar.split("|");
  const konu = tur === "konu";
  const soru = ne !== "iptal"
    ? "Fotoğrafı değiştirelim mi? Bir sonraki turda yeni kare çizilir, bu kare bir daha kullanılmaz."
    : konu
      ? "Bu konu iptal edilsin mi? Henüz yazılmadı, iptal etmek hiçbir şeye mal olmuyor."
      : "Bu gönderi iptal edilsin mi? Yayına çıkmayacak.";
  if (!confirm(soru)) return;
  try {
    const yol = "data/" + SITE + (konu ? "/topics.json" : "/social.json");
    const [doc, sha] = await oku(yol);
    const liste = konu ? (doc.topics || []) : (doc.posts || []);
    const k = liste.find((p) => konu
      ? (p.topic || "") === baslik && String(p.scheduled_for || "").slice(0, 10) === gun
      : (p.subject || "") === baslik && String(p.scheduled_for || "").slice(0, 10) === gun);
    if (!k) { toast("Kayıt bulunamadı — sayfayı yenile"); return; }
    if (ne === "iptal") k.iptal = true; else k.foto_degistir = true;
    await yaz(yol, doc, (ne === "iptal" ? "musteri iptal etti: " : "musteri fotograf degistirdi: ") +
              baslik.slice(0, 40), sha);
    toast(ne === "iptal"
      ? (konu ? "İptal edildi — bu konu yazılmayacak." : "İptal edildi — çıkmayacak.")
      : "İşaretlendi — bir sonraki turda değişecek.");
    await yukle();
  } catch (e) { toast("Olmadı: " + e.message); }
};

// ------------------------------------------------------------------- kabuk
function ciz() {
  document.getElementById("nav").innerHTML = BOLUM.map(([k, ad]) =>
    '<a href="#' + k + '" class="' + (k === SEK ? "on" : "") + '">' + svg(IKON[k]) + "<span>" + ad + "</span></a>").join("");
  const m = document.getElementById("main");
  if (!D) { m.innerHTML = '<div class="bos">Yükleniyor…</div>'; return; }
  const f = { bugun: ekranBugun, takvim: ekranTakvim, yazilar: ekranYazilar,
              gonderiler: ekranGonderiler, marka: ekranMarka, buyume: ekranBuyume }[SEK];
  m.innerHTML = f ? f() : "";
  window.scrollTo(0, 0);
}

async function yukle() {
  D = null; ciz();
  try {
    const [doc] = await oku("data/" + SITE + "/musteri.json");
    D = doc;
    document.getElementById("stamp").textContent = "Güncellendi " + tarih(doc.uretildi);
  } catch (e) {
    document.getElementById("main").innerHTML =
      '<div class="card pad"><h3 style="font-size:16px;font-weight:700">Veri okunamadı</h3>' +
      '<p class="note" style="margin-top:8px">' + E(e.message) + "</p>" +
      '<p class="note">Bu ön izleme sürümü panelin jetonunu kullanıyor. İçerik panelini bir kez aç, ' +
      "sonra buraya dön.</p></div>";
    return;
  }
  ciz();
}

document.getElementById("site").innerHTML =
  SITELER.map((s) => '<option value="' + s + '"' + (s === SITE ? " selected" : "") + ">" + s + "</option>").join("");
document.getElementById("site").onchange = (e) => {
  SITE = e.target.value; localStorage.setItem("postiada_site", SITE); yukle();
};
window.addEventListener("hashchange", () => {
  SEK = (location.hash || "#bugun").slice(1); ciz();
});
SEK = (location.hash || "#bugun").slice(1);
yukle();
</script>
