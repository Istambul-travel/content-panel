name: Testler

# 17.09.2026 — DEPODA TESTLER VARDI AMA HICBIR YERDE CALISMIYORDU.
# Ayni gun uc sessiz ariza bulundu: kod caliyor, hata vermiyor, makul
# gorunen ama yanlis sonuc uretiyordu. Ucu de bir testin yakalayabilecegi
# turdendi. Calismayan test, test degildir.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Uretim turlariyla AYNI surum. Farkli olsaydi CI yesil kalirken
          # gunluk is patlayabilirdi.
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # Sozdizimi once: bir dosya derlenmiyorsa testin ne dedigi onemsiz.
      - name: Derleme kontrolu
        run: python -m compileall -q engine scripts tests

      - name: Testler
        run: |
          hata=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            python "$t" || hata=1
            echo "::endgroup::"
          done
          exit $hata
