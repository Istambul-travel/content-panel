# =============================================================================
# istambul.com — site configuration
# Bu dosya Soro'nun "Brand DNA" ekranının yerini alır, ama beş şey fazladan yapar:
#   1. structure/       — makale yapısı ayrı bir alan (Soro'da voice kutusuna sıkışıyordu)
#   2. facts/           — doğrulanmış veri; fiyat/saat buradan gelir, modelden değil
#   3. link_map/        — kendi markalarına ve 199 lokasyon sayfasına yönlendirme
#   4. topic_scoring/   — konu seçimi trafik × ticari değer, sadece trafik değil
#   5. quality_gate/    — yayın öncesi zorunlu kontroller
# =============================================================================

slug: istambul
domain: istambul.com
language: en
timezone: Europe/Istanbul
enabled: true

# shadow: üretir, mail atar, YAYINLAMAZ. live: otomatik yayınlar.
mode: live

# -----------------------------------------------------------------------------
wordpress:
  api_base: https://istambul.com/wp-json/wp/v2
  user_env: WP_USER_ISTAMBUL
  app_password_env: WP_APPPASS_ISTAMBUL
  author_id: null            # ilk çalıştırmada tespit edilecek
  status: publish
  # TAKSONOMİ — 10.09.2026'da yeniden kuruldu.
  # Öncesinde 14 yazının hepsi "Cultural events" içindeydi; diğer kategoriler
  # tema demosundan kalma boş kabuklardı. Tek kategoride yığılmak topical
  # authority kurmuyor, dağıtıyor.
  #
  # match: konu ya da anahtar kelime bu ifadelerden birini içeriyorsa yazı o
  # kategoriye gider. Sıra önemli — ilk eşleşen kazanır, o yüzden dar olan
  # üstte, geniş olan altta. default_category eşleşme yoksa devreye girer.
  #
  # Kategoriler İSTENDİĞİNDE oluşturuluyor: yazısı olmayan kategori açılmıyor.
  # Boş kategori arşivi ince sayfadır, hiçbir işe yaramadan taranır.
  taxonomy_rebuilt: 2026-09-10
  default_category: istanbul-attractions
  target_categories:
    - {name: "Bosphorus & Golden Horn", slug: "bosphorus-golden-horn",
       match: [bosphorus, bosporus, golden horn, halic, cruise, boat tour,
               dinner cruise, yacht, ferry, from the water, miniaturk,
               pierre loti, eyup, fener, balat]}
    - {name: "Turkish Bath & Hamam", slug: "turkish-bath-hamam",
       match: [hamam, hammam, turkish bath, cemberlitas, cagaloglu,
               hurrem sultan, kese, spa]}
    - {name: "Cappadocia", slug: "cappadocia",
       match: [cappadocia, goreme, kapadokya, hot air balloon, underground city,
               fairy chimney, uchisar, avanos]}
    # "side" ve "kas" buradan çıkarıldı: Side ve Kaş gerçek Akdeniz
    # kasabaları ama "Asian side" başlığını da yakalıyor ve İstanbul
    # yazısını Ege & Akdeniz'e atıyorlardı. İki küçük destinasyon için
    # İstanbul yazılarını yanlış kategoriye göndermeye değmez.
    - {name: "Aegean & Mediterranean", slug: "aegean-mediterranean",
       match: [ephesus, pamukkale, antalya, bodrum, izmir, aegean,
               mediterranean, lycian, fethiye, oludeniz, troy, gallipoli,
               cesme, kusadasi]}
    - {name: "Practical Turkey", slug: "practical-turkey",
       match: [istanbulkart, airport, transfer, visa, currency, money, sim card,
               tram, metro, transport, getting around, layover, safety, tipping,
               when to visit, best time, weather, ramadan, public holiday]}
    # Gün ifadeleri hem rakamla hem yazıyla: "3 days in Istanbul" da geçiyor
    # "Istanbul in three days" da. Yalnızca "days in istanbul" yazınca ikincisi
    # kaçıyor ve yazı varsayılan kategoriye düşüyordu.
    - {name: "Istanbul Itineraries", slug: "istanbul-itineraries",
       match: [itinerary, itineraries, weekend, perfect day, first timer,
               first time visitors, how many days, asian side, plan your trip,
               one day, two days, three days, four days, five days,
               1 day, 2 days, 3 days, 4 days, 5 days,
               days in istanbul, day in istanbul, in a day]}
    - {name: "Istanbul Attractions", slug: "istanbul-attractions",
       match: [hagia sophia, blue mosque, topkapi, basilica cistern, cistern,
               dolmabahce, galata, camlica, tower, palace, mosque, museum,
               things to do, bucket list, viewpoint, attraction]}

# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# GÖRSELLER
# Karar (10.09.2026): stok fotoğraf yok, AI fotoğraf yok. Görseller yazının
# KENDİ doğrulanmış verisinden çizilen özgün grafikler: başlık kartı,
# "bir bakışta" künyesi, karşılaştırma tablosu, rota şeması.
#
# Gerekçe: AI fotoğraf zaten site kuralıyla yasak (avoid listesi) ve gerçek
# yapıların yapay görselleri hep hafif yanlış çıkıyor. Stok fotoğraf da
# istenmedi — zaten yüzlerce turizm sitesinde duruyor, özgünlük sinyali yok.
# Grafik ise siteye özgü, telifsiz ve stok fotoğrafın taşımadığı bir şeyi
# taşıyor: alıntılanabilir bilgi.
#
# Her grafik yalnızca facts.yaml'da verified: true olan veriden çiziliyor.
# Fact base'i boş bir marka için grafik üretilmiyor.
images:
  enabled: true
  provider: generated             # engine/visuals.py — dış servis yok
  # One cikan gorsel UC KADEMELI: (1) medya kutuphanesindeki GERCEK fotograf,
  # (2) AI fotograf, (3) markali grafik karti. Her kademe bir oncekinin
  # yoklugunda devreye giriyor; hicbir yazi gorselsiz kalmiyor.
  real_photo_first: true
  ai_photo: true                  # Evren 11.09.2026: AI fotograf serbest
  token_env: OPENAI_API_KEY
  per_article: 3                  # 1 öne çıkan + en fazla 2 veri grafiği
  width: 1200
  hero_size: [1200, 630]          # sosyal paylaşım ve arama önizleme ölçüsü
  language: en                    # site İngilizce; grafik etiketleri de öyle

# -----------------------------------------------------------------------------
# URL YAPISI
# Karar /blog/<slug> idi ama UYGULANAMADI ve geri alındı.
#
# Sebep: WordPress'in "permalink front" davranışı. /blog/ öneki verildiğinde
# with_front: true ile kayıtlı ÖZEL İÇERİK TİPLERİ de öneki alıyor. Traveler
# temasının 199 lokasyon sayfası /location/... adresinden /blog/location/...
# adresine taşındı ve eski adresler 404 oldu. 14 blog yazısı için yapılan
# değişiklik sitenin asıl varlığı olan 199 sayfayı kırdı.
#
# 10.09.2026'da denendi, ölçüldü, geri alındı. Site /%postname%/ yapısında.
# Blog yazıları /<slug>/, lokasyonlar /location/... — ikisi de sağlam.
#
# /blog/ öneki isteniyorsa tek doğru yol, lokasyon içerik tipini
# with_front: false ile yeniden kaydetmek. Bu tema kodu değişikliği demek ve
# tema güncellemesinde kaybolmaması için child theme ya da snippet eklentisi
# gerekir. Kazancı (14 URL'de /blog/ öneki) maliyetine değmiyor.
permalink:
  structure: "/%postname%/"
  blog_prefix_denendi: 2026-09-10
  blog_prefix_sonuc: "geri alındı — 199 lokasyon sayfasını kırıyor"

# -----------------------------------------------------------------------------
# Search Console — Site Kit'in WordPress ucundan okunuyor, Google'ın kendi
# API'si ve servis hesabı gerekmiyor.
#
# DURUM: Site Kit, Google verisini yalnızca tarayıcı oturumundan gelen
# isteklere veriyor. Motor doğru kullanıcı olarak giriyor (satirevren, id 1 —
# Site Kit'i bağlayan kullanıcının kendisi) ama Site Kit o isteğe Google
# oturumunu iliştirmiyor. Ayrı application password bunu ÇÖZMEZ, denendi.
#
# Bu yüzden search-console.json aylık turda TARAYICIDAN yazılıyor
# (zamanlanmış görev). Actions'taki adım hata verirse tur durmuyor.
# Aşağıdaki env alanları, ileride Google'ın kendi API'sine geçilirse diye
# duruyor; şu an boş.
search_console:
  # ANAHTAR KELIMELER BURADAN GELIYOR. Her sitenin kendi mulku ayri ayri
  # sorgulaniyor; ortak olan tek sey servis hesabi anahtari.
  #
  # 16.09.2026'ya kadar veri Site Kit uzerinden TARAYICIDAN cekiliyordu:
  # Site Kit sunucudan gelen isteklere Google verisini vermiyor
  # ("missing_required_scopes"). Artik Google'in kendi API'si kullaniliyor
  # ve sunucudan calisiyor.
  #
  # Mulk turu onemli: sc-domain:<alan> (Domain property) ile https://<alan>/
  # (URL-prefix) Google icin AYRI kayitlar, biri otekinin verisini vermiyor.
  # OLCULDU 17.09.2026: portfoydeki butun mulkler URL-PREFIX bicimde
  # (https://<alan>/), Domain property degil. sc-domain: yazilirsa Google
  # 404 donuyor — ikisi ayri kayit.
  property: https://istambul.com/
  service_account_env: GSC_SERVICE_ACCOUNT_JSON
  # Asagidaki iki satir ESKI Site Kit yolu icin. Servis hesabi calisinca
  # kullanilmiyor; yedek yol olarak duruyor.
  user_env: WP_USER_SC_ISTAMBUL
  app_password_env: WP_APPPASS_SC_ISTAMBUL
  min_impressions: 30          # bunun altındaki sorgu için yazı yazmaya değmez

schedule:
  posts_per_week: 3
  days: [monday, wednesday, friday]
  publish_time: "09:00"
  # Kademeli artış: 4. haftadan sonra 4, 8. haftadan sonra 5.
  ramp_up: {week_4: 4, week_8: 5}

social:
  # Hesap adi ilk kurulumda yanlis yazilmisti (istambulcom). Gercek hesap
  # @istambulguide -- 26 gonderi, one cikanlarda bes markanin hepsi var.
  instagram_handle: istambulguide
  facebook_page: istambulguide
  provider: meta               # meta | publer  (adaptor degisir, mimari degismez)
  # ONAY MODU. true ise gonderi uretiliyor, gorseli hazirlaniyor ama
  # YAYINLANMIYOR: panelde "Onay ve duzelt" ekraninda "ready" olarak
  # bekliyor. Orada metnini degistirip onaylayabilir ya da reddedebilirsin;
  # onayladigin gonderi bir sonraki sosyal turda cikiyor. Onay sonrasi
  # yayin model cagrisi yapmiyor, ek maliyeti yok.
  # false ise gonderi uretildigi anda cikiyor (varsayilan calisma bicimi).
  approval: false
  posts_per_week: 5
  # Kimlikler --discover ile token'a sorulup buraya yaziliyor; elle tahmin
  # edilmiyor, en sik yapilan kurulum hatasi o.
  instagram_user_id: "17841419870852460"   # @istambulguide
  facebook_page_id: "836931976171024"      # Istambul Tour sayfasi
  business_id: "287905324376170"           # Istambul Tour is portfoyu
  app_id: "1067225642770229"               # Travelpedia Content Engine
  token_env: META_ACCESS_TOKEN
  # Soro'nun hatasi: makale = tek gonderi. Burada karisim var.
  # GONDERI TASARIM KITI. Bu degerler @istambulguide hesabindaki MEVCUT
  # gonderilerden okundu, uydurulmadi: kirmizi/krem palet, tam sayfa fotograf,
  # ustte sikisik buyuk harf baslik, sol altta krem not karti, altta marka
