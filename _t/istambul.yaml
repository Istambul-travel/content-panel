# -----------------------------------------------------------------------------
business:
  what_it_is: >
    istambul.com is an English-language travel guide to Türkiye, not a booking
    engine. Its asset is a directory of 199 location pages covering the whole
    country — Istanbul, Cappadocia, the Aegean and Mediterranean coasts, ancient
    cities, museums, national parks — plus a blog of itinerary and planning
    guides. It sits at the top of the funnel: a first-time visitor researching
    "what should I see" arrives here, and leaves either with a booking on one of
    the group's own brand sites or through a partner link where the group has no
    product of its own.

  # "İkisi birden" kararı burada operasyonel hale geliyor.
  monetisation: hybrid
  rule: >
    If the article's subject maps to a product the group operates, link to that
    brand and never to a competitor or affiliate for the same subject. If it does
    not, use the partner link. One commercial link per article maximum, placed
    where it genuinely helps the reader, never in the opening paragraph.

# -----------------------------------------------------------------------------
# KENDİ MARKA HARİTASI — konu → kendi ürünü
link_map:
  # SIRA ONEMLI — ilk eslesen marka kazaniyor.
  #
  # Bu yuzden GENEL terimleri tutan marka EN SONA yaziliyor. "boat tour",
  # "dinner cruise" gibi kelimeler Bosporus listesinde; Bosporus basta
  # olsaydi "halic boat tour" sorgusu Golden Horn yerine Bosporus'a
  # gidiyordu — nitekim gidiyordu.
  own_brands:
    - match: [golden horn, halic, miniaturk, pierre loti, eyup, fener, balat from water]
      url: https://goldenhorncruise.com/
      name: Golden Horn Cruise
    - match: [hamam, hammam, hamami, turkish bath, baths, bath house,
              cemberlitas, cagaloglu, hurrem sultan, kese, spa istanbul]
      url: https://istanbulhamam.com/
      name: Istanbul Hamam
    - match: [camlica, camlica hill, camlica tower, panoramic view istanbul,
              asian side viewpoint, observation deck]
      url: https://camlicatower.com/
      name: Camlica Tower
    - match: [cistern, serefiye, theodosius cistern, dervish show, whirling dervishes]
      url: https://cisternoftheodosius.com/
      name: Cistern of Theodosius
    # Genel tekne/gezinti terimleri burada, o yuzden en sonda.
    - match: [bosphorus, bosporus, bosfor, boat tour, boat trip, river cruise,
              dinner cruise, yacht, sunset cruise, shore excursion,
              dolmabahce from water, ortakoy, bebek, rumeli fortress]
      url: https://bosporuscruise.com/
      name: Bosporus Cruise
      anchor_style: "descriptive"     # "Bosphorus dinner cruise" — asla "buraya tıklayın"

  # Kendi ürünü OLMAYAN konular — partner link
  affiliate_topics:
    - cappadocia hot air balloon
    - pamukkale
    - ephesus
    - antalya
    - hotels
    - airport transfer
    - car rental
    - domestic flights

  # 199 lokasyon sayfası. Her makale en az 2'sine link vermeli.
  # Sitemap'ten otomatik indekslenir: data/istambul.com/link-index.json
  location_sitemap: https://istambul.com/location-sitemap.xml
  post_sitemap: https://istambul.com/post-sitemap.xml

  policy:
    min_internal_links: 3          # en az 1 lokasyon sayfası + 1 blog yazısı
    min_location_links: 1
    min_official_source_links: 1   # Soro'nun bugün ihlal ettiği kural
    max_commercial_links: 1
    # Beyaz liste sadece müze ve belediye siteleriyken tekne/hamam gibi
    # konularda modelin bağlayacağı uygun bir resmi kaynak kalmıyordu ve
    # yazı boşuna reddediliyordu. Ulaşım, deniz ulaşımı ve turizm
    # kurumlarını da ekledim.
    official_source_whitelist:
      - muze.gov.tr                    # Müzeler ve ören yerleri
      - millisaraylar.gov.tr           # Dolmabahçe, Topkapı vb. saraylar
      - ktb.gov.tr                     # Kültür ve Turizm Bakanlığı
      - goturkiye.com                  # resmi turizm portalı
      - ibb.gov.tr                     # İstanbul Büyükşehir Belediyesi
      - istanbul.gov.tr                # Valilik
      - istanbulkart.istanbul          # ulaşım kartı
      - iett.istanbul                  # otobüs/tramvay
      - sehirhatlari.istanbul          # Şehir Hatları vapurları
      - metro.istanbul                 # metro
      - turkiye.gov.tr                 # e-Devlet
      - namazvakitleri.diyanet.gov.tr  # namaz vakitleri
      - mgm.gov.tr                     # meteoroloji
      - tursab.org.tr                  # TÜRSAB acente doğrulama

# -----------------------------------------------------------------------------
voice: >
  A well-travelled friend who actually lives here and answers the question you
  asked. Warm, specific, unhurried but never padded. Türkiye is safe, welcoming
  and easy to travel in for anyone who knows a few things in advance — that is
  the baseline, and nothing is framed as risk or adventure. No superlatives that
  cannot be checked, no invented statistics, no awards, no "hidden gem" or
  "must-see" filler. Where a fact can be stated, it is stated; "prices vary,
  check the official site" is a failure, not caution. British spelling.

structure:
  - "Answer the title question in the first two sentences. No scene-setting."
  - "Essentials block: how long it takes, closed days, nearest tram/metro stop and
     walking time, dress code if relevant, what needs booking ahead."
  - "H2 headings are noun phrases, with the year where it helps. Not questions."
  - "Be concrete: opening hours, closed days, prayer-closure windows, walking
     times, distances in km, tram/metro line numbers and stop names."
  - "At least one link to an official source (see whitelist)."
  - "At least three internal links: one location page, one earlier blog post."
  - "FAQ block of 5-6 real questions. The first word of each answer is the answer:
     'Yes, but...', 'No.', 'Only on Tuesdays.', 'About 45 minutes.'"
  - "One closing paragraph. If the group operates a product for this subject, this
     is where it is mentioned once, plainly, as the practical option."

audience: >
  Independent international leisure travellers planning a first or second trip to
  Türkiye, researching in English, often in a second language. Couples, families
  and solo travellers who build their own itinerary rather than buying a package.
  They search "3 days in Istanbul", "is Cappadocia worth it", "Hagia Sophia
  opening hours", "how to get from the airport", "best time to visit Pamukkale".
  Their friction: contradictory information across dozens of sites, unclear ticket
  and transport systems, fear of overpaying, and not knowing how much time a place
  actually takes. Write for someone intelligent who has never been here.

avoid:
  - "Never state a price, fee or fare as a number unless it exists in facts.yaml
     with verified: true. This is the single hard rule."
  - "No invented awards, certifications, Michelin references or statistics."
  - "Never present Türkiye or any Turkish city as dangerous."
  - "No political content; religion only as cultural and historical context."
  - "Do not name competitor guide sites or city passes as better options."
  - "Do not promise refunds, guarantees or services the group does not offer."
  - "No AI-generated images. Real photography only."

themes:
  - Istanbul itineraries, 1 to 5 days, and how to sequence the Old City
  - Individual Istanbul attractions: hours, closed days, how long to allow
  - The Bosphorus and the Golden Horn from the water
  - Turkish bath culture and how to choose a hamam
  - Çamlıca Hill and Istanbul's viewpoints
  - Byzantine Istanbul: cisterns, walls, churches
  - Cappadocia: Göreme, valleys, underground cities, balloons
  - The Aegean and Mediterranean: Ephesus, Pamukkale, Lycian coast, ancient cities
  - Practical Türkiye: Istanbulkart, trams, airports, transfers, money, SIM, visas
  - When to go: season, weather, crowds, Ramadan and public holidays

# -----------------------------------------------------------------------------
topic_scoring:
  # Soro sadece potential_traffic'e bakıyor. Bu yüzden trafiği 170 olan
  # "How to Handle Istanbul Travel Emergencies" gibi hiçbir şey sattırmayan
  # konular takvime giriyor. Burada ticari değer ağırlıklı.
  weights:
    search_volume: 0.30
    commercial_intent: 0.35     # kendi ürününe yakınlık
    own_product_match: 0.20     # link_map.own_brands'ta karşılığı var mı
    gap: 0.15                   # o konuda henüz yazı yok mu
    # Geri donus yakinligi: sorguda kacinci siradayiz. 12. sirada bir yazi
    # ilk sayfaya tasiyabilir, 63. sirada ayni yazi aylar surer. Search
    # Console verisi olmayan adaylarda notr (0,50) sayiliyor.
    payoff_proximity: 0.15       # kac siralik yol kaldi
  min_score_to_schedule: 0.45

quality_gate:
  min_words: 1100
  max_words: 2200
  require_faq_min: 5
  # SEO/AEO/GEO puanı bu eşiğin altındaysa ikinci deneme tetiklenir ve zayıf
  # maddeler modele düzeltme talimatı olarak geri verilir. Puan tek başına
  # yayını engellemez — onu fail listesi yapar.
  # 65'ten 75'e çıkarıldı: model aynı konuda 90 da yazıyor 77 de, sapma
  # gerçek. Eşik yükselince zayıf yazı yeniden üretiliyor ve denemelerin
  # en iyisi yayınlanıyor. Ek maliyet makale başına en fazla ~5 sent.
  min_seo_score: 75
  max_similarity_to_existing: 0.72
  fail_on:
    - unverified_number         # facts.yaml'da olmayan rakam
    - missing_official_source
    - internal_links_below_min
    - broken_link
    - banned_phrase
    - duplicate_target_keyword
    - commercial_link_in_intro
  banned_phrases:
    - "in today's fast-paced world"
    - "nestled in the heart of"
    - "hidden gem"
    - "must-see"
    - "whether you're a"
    - "look no further"
